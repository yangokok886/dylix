[workspace]
resolver = "2"
members = ["crates/reipa-macho", "crates/reipa-image", "crates/reipa-objc", "bridge"]
[workspace.package]
edition = "2021"
version = "0.1.0"
[workspace.dependencies]
thiserror = "1"
reipa-macho = { path = "crates/reipa-macho" }
reipa-image = { path = "crates/reipa-image" }
reipa-objc = { path = "crates/reipa-objc" }
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "unwind"
